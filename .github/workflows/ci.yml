
name: Customer Support Intelligence Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_USERNAME: support_user
      DB_PASSWORD: support_password

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: support_platform
          POSTGRES_USER: support_user
          POSTGRES_PASSWORD: support_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_user -d support_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:4.0.1
        ports:
          - 9092:9092

    defaults:
      run:
        working-directory: support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: ./mvnw -B test

  ai-service-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Run AI service tests
        run: python -m pytest -v
