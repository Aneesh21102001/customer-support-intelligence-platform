services:
  postgres:
    image: postgres:16
    container_name: support-postgres
    environment:
      POSTGRES_DB: support_platform
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: support-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  ai-service:
    build:
      context: ./ai-service
    container_name: support-ai
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ${USERPROFILE}/.cache/chroma:/root/.cache/chroma

  support:
    build:
      context: ./support
    container_name: support-backend
    environment:
      DB_HOST: postgres
      DB_USERNAME: support_user
      DB_PASSWORD: support_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
      - ai-service

  dashboard:
    build:
      context: ./dashboard
    container_name: support-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - support

volumes:
  postgres_data: